name: CI/CD – Build & Deploy LLM API

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t prashantsingh1234/llm-api:latest .
          docker push prashantsingh1234/llm-api:latest

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker pull prashantsingh1234/llm-api:latest
            docker stop llm-api || true
            docker rm llm-api || true
            docker run -d \
              --name llm-api \
              -p 8000:8000 \
              prashantsingh1234/llm-api:latest
