name: CI/CD – Deploy LLM Backend & UI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Docker Login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Backend Image
      - name: Build & Push Backend Image
        run: |
          docker build -t prashantsingh1234/llm-api-backend:latest .
          docker push prashantsingh1234/llm-api-backend:latest

      # 4️⃣ Build & Push Frontend Image
      - name: Build & Push Frontend Image
        run: |
          docker build -t prashantsingh1234/llm-api-ui:latest ./ui
          docker push prashantsingh1234/llm-api-ui:latest

      # 5️⃣ Deploy on VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "Pulling images..."
            docker pull prashantsingh1234/llm-api-backend:latest
            docker pull prashantsingh1234/llm-api-ui:latest

            echo "Stopping old containers..."
            docker stop llm-api-backend llm-api-ui || true
            docker rm llm-api-backend llm-api-ui || true

            echo "Starting backend..."
            docker run -d \
              --name llm-api-backend \
              -p 8000:8000 \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              prashantsingh1234/llm-api-backend:latest

            echo "Starting frontend..."
            docker run -d \
              --name llm-api-ui \
              -p 80:80 \
              prashantsingh1234/llm-api-ui:latest
