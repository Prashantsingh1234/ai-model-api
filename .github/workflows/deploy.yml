name: CI/CD – Build & Deploy LLM API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------
      # 1️⃣ Checkout the repository
      # ------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ------------------------------------
      # 2️⃣ Login to Docker Hub
      # ------------------------------------
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------
      # 3️⃣ Build & Push Docker Image
      # ------------------------------------
      - name: Build and push Docker image
        run: |
          docker build -t prashantsingh1234/llm-api:latest .
          docker push prashantsingh1234/llm-api:latest

      # ------------------------------------
      # 4️⃣ Deploy to VPS (with HF_TOKEN)
      # ------------------------------------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            docker pull prashantsingh1234/llm-api:latest

            echo "Stopping old container (if exists)..."
            docker stop llm-api || true
            docker rm llm-api || true

            echo "Starting new container with HF_TOKEN..."
            docker run -d \
              --name llm-api \
              -p 8000:8000 \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              prashantsingh1234/llm-api:latest
